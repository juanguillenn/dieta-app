:anywhere}.preptime{color:#7a6840;font-weight:650}.status{padding:12px 14px;margin-bottom:14px;border-radius:16px;background:#fff8e0c7;font-size:13px;color:#625832}.import{display:inline-flex;align-items:center;justify-content:center}.file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}dialog{width:min(600px,calc(100% - 22px));border:0;border-radius:26px;padding:0;background:transparent}dialog::backdrop{background:#191e2866;backdrop-filter:blur(8px)}form{padding:18px;border-radius:26px;background:#f8f9fbfa}label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:16px 0 6px}.field{width:100%;border:1px solid #787d8c33;border-radius:15px;padding:12px;background:white;font:inherit}.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}.switchrow{display:flex;align-items:center;gap:8px;padding:11px;border-radius:15px;background:white;color:var(--text);font-size:13px}.actions{margin-top:16px}.primary{background:var(--accent);color:white;padding:0 18px;font-weight:700}.note{min-height:100px;resize:vertical}.small{font-size:12px;color:var(--muted)}@media(max-width:440px){.grid{grid-template-columns:1fr}.segwrap{justify-content:space-between}.seg button{padding:0 10px}.app{padding-left:12px;padding-right:12px}}@media(display-mode:standalone){html,body{background-color:var(--top)}}
</style></head><body><main class="app"><header class="top"><div><div class="eyebrow">Plan semanal privado</div><h1>Dieta</h1></div><label class="icon import" for="file" aria-label="Importar Excel">↻</label><input id="file" class="file" type="file" accept=".xls,.xlsx,.xlsm"></header><div class="segwrap"><div class="seg"><button data-view="today" class="on">Hoy</button><button data-view="week">Semana</button></div><div class="seg"><button data-p="1">1</button><button data-p="2" class="on">2 personas</button></div></div><div id="status" class="status">Selecciona tu Excel. Se procesará únicamente en este dispositivo.</div><section id="today" class="hidden"><div class="head"><div><div id="range" class="small"></div><h2 id="day"></h2></div><div><button id="prev" class="icon">‹</button><button id="next" class="icon">›</button></div></div><div id="cards" class="cards"></div><section id="prep" class="prep hidden"><div class="preptitle"><span>⏳</span><div class="eyebrow">Preparar con antelación</div></div><div id="preplist"></div></section><button id="extrasBtn" class="subtle">Ver todo el día</button><div id="extras" class="cards hidden"></div></section><section id="week" class="hidden"><div class="head"><div><div id="range2" class="small"></div><h2>Comidas y cenas</h2></div></div><div id="weekrows" class="week"></div></section></main><dialog id="dlg"><form method="dialog" id="form"><div class="dialogtop"><div><div id="dtype" class="eyebrow"></div><h2 id="dtitle"></h2></div><button class="icon" value="cancel">×</button></div><label>Nombre de la receta</label><input id="titlein" class="field"><div class="grid"><div><label>Tiempo aproximado</label><input id="timein" class="field" type="number" min="0" step="5" placeholder="30"></div><div><label>Preparación</label><label class="switchrow"><input id="prepin" type="checkbox"> Conviene prepararla el día anterior</label></div></div><label>Notas</label><textarea id="notein" class="field note" placeholder="Tus notas para esta receta…"></textarea><div class="actions"><span></span><button class="primary" value="default">Guardar</button></div></form></dialog><script>
const ZONE='Europe/Madrid',DAYS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'],MAIN=['Comida','Cena'],EXTRA=['Desayuno','Media mañana','Merienda'],RANGES={'Desayuno':[14,20],'Media mañana':[21,27],'Comida':[28,37],'Merienda':[38,44],'Cena':[45,54]},COLS=[2,5,8,11,14,17,20];let S={data:null,p:2,i:0,view:'today',extras:false,active:null};const $=id=>document.getElementById(id),KEY='dieta.recipes.v1',DATA_KEY='dieta.localData.v2';
function reg(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return{}}}function saveReg(r){localStorage.setItem(KEY,JSON.stringify(r))}function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/^tr\s+/,'').replace(/\([^)]*\)/g,' ').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim()}function fp(a){return a.map(x=>norm(x.name)).filter(Boolean).sort().join('|')}function clean(s){return cap(String(s||'').replace(/^TR\s+/i,'').replace(/\s*\([^)]*\)\s*/g,' ').trim())}function cap(s){let v=String(s||'').trim().toLocaleLowerCase('es-ES');return v?v[0].toLocaleUpperCase('es-ES')+v.slice(1):v}function titlePart(s){let n=norm(s),rules=[[/^cuscus\b/,'cuscús'],[/^pasta tricolor\b/,'pasta tricolor'],[/^pasta\b/,'pasta'],[/^gambones?\b/,'gambones'],[/^langostinos?\b/,'langostinos'],[/^espinacas?\b/,'espinacas'],[/^carne picada vacuno y cerdo\b/,'carne'],[/^carne picada pollo\b/,'carne de pollo'],[/^carne\b/,'carne'],[/^boniato\b|^batata\b/,'boniato'],[/^patata\b/,'patata'],[/^contramuslo pavo\b/,'pavo'],[/^pechuga pollo\b/,'pollo'],[/^hamburguesa vacuno\b/,'hamburguesa'],[/^arroz sushi\b/,'poke'],[/^atun\b/,'atún'],[/^lentejas\b/,'lentejas'],[/^plato preparado salmon\b/,'salmón']];for(let[re,label]of rules)if(re.test(n))return label;return clean(s)}function auto(a,t){if(!a.length)return t;let names=a.map(x=>norm(x.name)),has=p=>names.some(n=>p.test(n)),presets=[[/^cuscus\b/,/^carne picada/,'Cuscús con carne'],[/^pasta\b/,/^gambones?\b/,'Pasta con gambones'],[/^langostinos?\b/,/^espinacas?\b/,'Langostinos con espinacas'],[/^carne picada vacuno y cerdo\b/,/^boniato\b/,'Carne con boniato'],[/^carne picada pollo\b/,/^tortillas de trigo\b/,'Tacos de pollo'],[/^hamburguesa vacuno\b/,/^brioche hamburguesa\b/,'Hamburguesa'],[/^arroz sushi\b/,/^atun\b/,'Poke de atún']];for(let[a,b,title]of presets)if(has(a)&&has(b))return title;let candidates=a.filter(x=>!(/^(aceite|mayonesa|ketchup|azucar|vinagre|miel|sal|diente de ajo|ajo|cebolla|tomate|pepino|zanahoria|salsa|yogur|queso|aguacate|pan|brioche|nestea|maiz|uvas|cilantro|pimiento|aceitunas|mermelada)/i.test(norm(x.name)))).slice(0,2).map(x=>titlePart(x.name));if(!candidates.length)candidates=a.slice(0,2).map(x=>titlePart(x.name));return cap(candidates.length>1?`${candidates[0]} con ${candidates[1]}`:candidates[0])}function estimate(a){let s=a.map(x=>norm(x.name)).join(' ');if(/comida fuera|plato preparado/.test(s))return 10;if(/cuscus|pasta|langostinos|gambones|arroz sushi/.test(s))return 25;if(/contramuslo|pechuga|carne picada|hamburguesa/.test(s))return 35;return 30}function meta(d,t){let a=d.meals[t]||[],f=fp(a),r=reg()[f]||{};return{fp:f,title:cap(r.title||auto(a,t)),note:r.note||'',time:r.time??estimate(a),prep:!!r.prep}}function fq(q){let n=Number(q)*S.p;return Number.isInteger(n)?n:(Math.round(n*100)/100).toLocaleString('es-ES')}
function ymd(y,m,d){return `${String(y).padStart(4,'0')}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`}function addDays(k,n){let [y,m,d]=k.split('-').map(Number),x=new Date(Date.UTC(y,m-1,d+n,12));return ymd(x.getUTCFullYear(),x.getUTCMonth()+1,x.getUTCDate())}function madridToday(now=new Date()){let p=new Intl.DateTimeFormat('en-CA',{timeZone:ZONE,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(now),v=Object.fromEntries(p.map(x=>[x.type,x.value]));return `${v.year}-${v.month}-${v.day}`}function todayIdx(){let i=S.data.days.findIndex(x=>x.date===madridToday());return i>=0?i:0}function asDate(k){let[y,m,d]=k.split('-').map(Number);return new Date(Date.UTC(y,m-1,d,12))}function range(){let a=asDate(S.data.days[0].date),b=asDate(S.data.days[6].date);return `${a.getUTCDate()}–${b.getUTCDate()} ${new Intl.DateTimeFormat('es-ES',{month:'long',timeZone:'UTC'}).format(a)}`}
function card(d,t){let a=d.meals[t]||[];if(!a.length)return null;let m=meta(d,t),c=document.createElement('article');c.className='card '+(t==='Cena'?'dinner':'');c.innerHTML=`<div class="rtype">${t}</div><button class="rtitle"></button><div class="meta">${m.time?`<span class="chip">⏱ ${m.time} min</span>`:''}${m.prep?'<span class="chip">⏳ Preparar el día anterior</span>':''}</div><div class="ings"></div>`;c.querySelector('.rtitle').textContent=m.title;c.querySelector('.rtitle').onclick=()=>openDlg(d,t);let box=c.querySelector('.ings');a.forEach(x=>{let r=document.createElement('div');r.className='ing';r.innerHTML='<span></span><span class="qty"></span>';r.children[0].textContent=clean(x.name);r.children[1].textContent=`${fq(x.qty)} ${x.unit||''}`.trim();box.append(r)});return c}function renderPrep(){let p=$('prep'),box=$('preplist'),found=[];box.innerHTML='';S.data.days.forEach(d=>MAIN.forEach(t=>{let m=meta(d,t);if(m.prep)found.push({d,t,m})}));p.classList.toggle('hidden',!found.length);found.forEach(x=>{let b=document.createElement('button');b.className='prepitem';b.innerHTML=`<span class="small">${x.d.name} · ${x.t} · <span class="preptime">${x.m.time||'—'} min</span></span><b></b>`;b.querySelector('b').textContent=x.m.title;b.onclick=()=>openDlg(x.d,x.t);box.append(b)})}function renderDay(){let d=S.data.days[S.i];$('range').textContent=range();$('day').textContent=d.name;$('cards').innerHTML='';MAIN.forEach(t=>{let c=card(d,t);if(c)$('cards').append(c)});$('extras').innerHTML='';EXTRA.forEach(t=>{let c=card(d,t);if(c)$('extras').append(c)});$('extras').classList.toggle('hidden',!S.extras);$('extrasBtn').textContent=S.extras?'Ocultar resto del día':'Ver todo el día'}
function weekMeal(d,t,m){let b=document.createElement('button');b.className='wmeal';b.innerHTML=`<div class="wl">${t}</div><div class="wt"><span class="wname"></span>${m.time?` <span class="wtime">· ${m.time} min</span>`:''}${m.prep?'<span class="whour">⏳</span>':''}</div>`;b.querySelector('.wname').textContent=m.title;b.onclick=e=>{e.stopPropagation();openDlg(d,t)};return b}function renderWeek(){$('range2').textContent=range();$('weekrows').innerHTML='';S.data.days.forEach((d,i)=>{let row=document.createElement('div');row.className='wrow '+(i===todayIdx()?'today':'');let day=document.createElement('button');day.className='wday';day.textContent=d.name.slice(0,3);day.onclick=()=>{S.i=i;setView('today');renderDay()};let meals=document.createElement('div');meals.className='wmeals';meals.append(weekMeal(d,'Comida',meta(d,'Comida')),weekMeal(d,'Cena',meta(d,'Cena')));row.append(day,meals);$('weekrows').append(row)})}function render(){renderPrep();renderDay();renderWeek()}function setView(v){S.view=v;$('today').classList.toggle('hidden',v!=='today'||!S.data);$('week').classList.toggle('hidden',v!=='week'||!S.data);document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===v))}function openDlg(d,t){let m=meta(d,t);S.active={d,t,...m};$('dtype').textContent=`${d.name} · ${t}`;$('dtitle').textContent=m.title;$('titlein').value=m.title;$('timein').value=m.time||'';$('prepin').checked=m.prep;$('notein').value=m.note;$('dlg').showModal()}
function cell(s,a){return s?.[a]?.v??null}function startDate(s){let r=cell(s,'C9'),p;if(typeof r==='number')p=XLSX.SSF.parse_date_code(r);else if(r instanceof Date)p={y:r.getFullYear(),m:r.getMonth()+1,d:r.getDate()};else if(typeof r==='string'){let x=r.match(/(\d{1,2})\D+(\d{1,2})\D+(\d{4})/);if(x)p={y:+x[3],m:+x[2],d:+x[1]}}if(!p?.y)throw Error('La fecha inicial de Dieta!C9 no es válida');return ymd(p.y,p.m,p.d)}function parseWorkbook(buf){let wb=XLSX.read(buf,{type:'array',cellDates:false}),diet=wb.Sheets.Dieta,db=wb.Sheets.DB;if(!diet)throw Error('No se encontró la hoja Dieta');let units={};XLSX.utils.sheet_to_json(db||{},{header:1,defval:''}).slice(1).forEach(r=>{if(r[0])units[String(r[0]).trim().toLowerCase()]=r[1]||''});let start=startDate(diet),days=DAYS.map((name,i)=>{let meals={};for(let[t,[a,b]]of Object.entries(RANGES)){let items=[];for(let row=a;row<=b;row++){let food=cell(diet,XLSX.utils.encode_cell({r:row-1,c:COLS[i]-1})),qty=cell(diet,XLSX.utils.encode_cell({r:row-1,c:COLS[i]})),unit=cell(diet,XLSX.utils.encode_cell({r:row-1,c:COLS[i]+1}));if(food!==null&&food!==''&&qty!==null&&qty!==''){if(!unit||String(unit).startsWith('='))unit=units[String(food).trim().toLowerCase()]||'';items.push({name:String(food),qty:Number(qty),unit:String(unit||'')})}}meals[t]=items}return{name,date:addDays(start,i),meals}});return{updatedAt:new Date().toISOString(),days}}async function importFile(f){try{$('status').textContent='Leyendo el Excel en este dispositivo…';let d=parseWorkbook(await f.arrayBuffer());S.data=d;S.i=todayIdx();localStorage.setItem(DATA_KEY,JSON.stringify(d));setView(S.view);render();$('status').textContent='Dieta importada de forma privada en este dispositivo.';setTimeout(()=>$('status').classList.add('hidden'),2500)}catch(e){$('status').textContent=`No se pudo leer el Excel: ${e.message}`}}
$('form').onsubmit=e=>{if(e.submitter?.value==='default'){let a=S.active,r=reg();r[a.fp]={title:$('titlein').value.trim()||a.title,time:Number($('timein').value)||null,prep:$('prepin').checked,note:$('notein').value.trim()};saveReg(r);render()}};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{S.p=Number(b.dataset.p);document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('on',Number(x.dataset.p)===S.p));if(S.data)render()});$('prev').onclick=()=>{S.i=(S.i+6)%7;renderDay()};$('next').onclick=()=>{S.i=(S.i+1)%7;renderDay()};$('extrasBtn').onclick=()=>{S.extras=!S.extras;renderDay()};$('file').onchange=e=>{let f=e.target.files?.[0];if(f)importFile(f);e.target.value=''};try{let c=localStorage.getItem(DATA_KEY);if(c){S.data=JSON.parse(c);S.i=todayIdx();setView('today');render();$('status').textContent='Dieta privada cargada desde este dispositivo.';setTimeout(()=>$('status').classList.add('hidden'),1800)}}catch{localStorage.removeItem(DATA_KEY)}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
