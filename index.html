function ymd(y,m,d){return `${String(y).padStart(4,'0')}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`}function addDays(k,n){let [y,m,d]=k.split('-').map(Number),x=new Date(Date.UTC(y,m-1,d+n,12));return ymd(x.getUTCFullYear(),x.getUTCMonth()+1,x.getUTCDate())}function madridToday(now=new Date()){let p=new Intl.DateTimeFormat('en-CA',{timeZone:ZONE,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(now),v=Object.fromEntries(p.map(x=>[x.type,x.value]));return `${v.year}-${v.month}-${v.day}`}function todayIdx(){let i=S.data.days.findIndex(x=>x.date===madridToday());return i>=0?i:0}function asDate(k){let[y,m,d]=k.split('-').map(Number);return new Date(Date.UTC(y,m-1,d,12))}function range(){let a=asDate(S.data.days[0].date),b=asDate(S.data.days[6].date);return `${a.getUTCDate()}–${b.getUTCDate()} ${new Intl.DateTimeFormat('es-ES',{month:'long',timeZone:'UTC'}).format(a)}`}
function card(d,t){let a=d.meals[t]||[];if(!a.length)return null;let m=meta(d,t),c=document.createElement('article');c.className='card '+(t==='Cena'?'dinner':'');c.innerHTML=`<div class="rtype">${t}</div><button class="rtitle"></button><div class="meta">${m.time?`<span class="chip">⏱ ${m.time} min</span>`:''}${m.prep?'<span class="chip">⏳ Preparar el día anterior</span>':''}</div><div class="ings"></div>`;c.querySelector('.rtitle').textContent=m.title;c.querySelector('.rtitle').onclick=()=>openDlg(d,t);let box=c.querySelector('.ings');a.forEach(x=>{let r=document.createElement('div');r.className='ing';r.innerHTML='<span></span><span class="qty"></span>';r.children[0].textContent=clean(x.name);r.children[1].textContent=`${fq(x.qty)} ${x.unit||''}`.trim();box.append(r)});return c}function renderPrep(){let p=$('prep'),box=$('preplist'),found=[];box.innerHTML='';S.data.days.forEach(d=>MAIN.forEach(t=>{let m=meta(d,t);if(m.prep)found.push({d,t,m})}));p.classList.toggle('hidden',!found.length);found.forEach(x=>{let b=document.createElement('button');b.className='prepitem';b.innerHTML=`<span class="small">${x.d.name} · ${x.t} · <span class="preptime">${x.m.time||'—'} min</span></span><b></b>`;b.querySelector('b').textContent=x.m.title;b.onclick=()=>openDlg(x.d,x.t);box.append(b)})}function renderDay(){let d=S.data.days[S.i];$('range').textContent=range();$('day').textContent=d.name;$('cards').innerHTML='';MAIN.forEach(t=>{let c=card(d,t);if(c)$('cards').append(c)});$('extras').innerHTML='';EXTRA.forEach(t=>{let c=card(d,t);if(c)$('extras').append(c)});$('extras').classList.toggle('hidden',!S.extras);$('extrasBtn').textContent=S.extras?'Ocultar resto del día':'Ver todo el día'}
function weekMeal(d,t,m){let b=document.createElement('button');b.className='wmeal';b.innerHTML=`<div class="wl">${t}</div><div class="wt"><span class="wname"></span>${m.time?` <span class="wtime">· ${m.time} min</span>`:''}${m.prep?'<span class="whour">⏳</span>':''}</div>`;b.querySelector('.wname').textContent=m.title;b.onclick=e=>{e.stopPropagation();openDlg(d,t)};return b}function renderWeek(){$('range2').textContent=range();$('weekrows').innerHTML='';S.data.days.forEach((d,i)=>{let row=document.createElement('div');row.className='wrow '+(i===todayIdx()? 'today':'');let day=document.createElement('button');day.className='wday';day.textContent=d.name.slice(0,3);day.onclick=()=>{S.i=i;setView('today');renderDay()};let meals=document.createElement('div');meals.className='wmeals';meals.append(weekMeal(d,'Comida',meta(d,'Comida')),weekMeal(d,'Cena',meta(d,'Cena')));row.append(day,meals);$('weekrows').append(row)})}function renderShopping(){if(!S.shopping.length)loadShopping();$('buyrange').textContent=`${range()} · ${S.buyStatus==='sent'?'Compra enviada':'Compra preparada'}`;$('shortcutBuy').textContent=S.buyStatus==='sent'?'Ya enviada':'Enviar a AnyList';let box=$('buylist');box.innerHTML='';let groups=Object.groupBy?Object.groupBy(S.shopping,x=>x.category):S.shopping.reduce((a,x)=>((a[x.category]??=[]).push(x),a),{});Object.entries(groups).forEach(([cat,items])=>{let section=document.createElement('section');section.className='buycat';let h=document.createElement('h3');h.textContent=cat;section.append(h);items.forEach(item=>{let row=document.createElement('div');row.className='buyrow';let check=document.createElement('input');check.type='checkbox';check.checked=item.selected;check.setAttribute('aria-label',`Incluir ${item.name}`);check.onchange=()=>{item.selected=check.checked;saveBuy()};let name=document.createElement('span');name.className='buyname';name.textContent=item.name;let qty=document.createElement('input');qty.className='buyqty';qty.value=displayAmount(item);qty.setAttribute('aria-label',`Cantidad de ${item.name}`);qty.onchange=()=>{let m=qty.value.trim().match(/^([\d.,]+)\s*(.*)$/);if(m){let n=Number(m[1].replace(',','.')),[u,f]=unitInfo(m[2]);if(Number.isFinite(n)){item.quantity=n*f;item.unit=u;saveBuy();qty.value=displayAmount(item)}}};let del=document.createElement('button');del.className='remove';del.textContent='×';del.setAttribute('aria-label',`Eliminar ${item.name}`);del.onclick=()=>{S.shopping=S.shopping.filter(x=>x.id!==item.id);saveBuy();renderShopping()};row.append(check,name,qty,del);section.append(row)});box.append(section)});if(!S.shopping.length){let empty=document.createElement('div');empty.className='buyintro';empty.textContent='No hay ingredientes en esta semana.';box.append(empty)}}function render(){renderPrep();renderDay();renderWeek();if(S.view==='shopping')renderShopping()}function setView(v){S.view=v;['today','week','shopping'].forEach(id=>$(id).classList.toggle('hidden',v!==id||!S.data));document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===v));if(v==='shopping'&&S.data)renderShopping()}function openDlg(d,t){let m=meta(d,t);S.active={d,t,...m};$('dtype').textContent=`${d.name} · ${t}`;$('dtitle').textContent=m.title;$('titlein').value=m.title;$('timein').value=m.time||'';$('prepin').checked=m.prep;$('notein').value=m.note;$('dlg').showModal()}
function cell(s,a){return s?.[a]?.v??null}function startDate(s){let r=cell(s,'C9'),p;if(typeof r==='number')p=XLSX.SSF.parse_date_code(r);else if(r instanceof Date)p={y:r.getFullYear(),m:r.getMonth()+1,d:r.getDate()};else if(typeof r==='string'){let x=r.match(/(\d{1,2})\D+(\d{1,2})\D+(\d{4})/);if(x)p={y:+x[3],m:+x[2],d:+x[1]}}if(!p?.y)throw Error('La fecha inicial de Dieta!C9 no es válida');return ymd(p.y,p.m,p.d)}function parseWorkbook(buf){let wb=XLSX.read(buf,{type:'array',cellDates:false}),diet=wb.Sheets.Dieta,db=wb.Sheets.DB;if(!diet)throw Error('No se encontró la hoja Dieta');let units={};XLSX.utils.sheet_to_json(db||{},{header:1,defval:''}).slice(1).forEach(r=>{if(r[0])units[String(r[0]).trim().toLowerCase()]=r[1]||''});let start=startDate(diet),days=DAYS.map((name,i)=>{let meals={};for(let[t,[a,b]]of Object.entries(RANGES)){let items=[];for(let row=a;row<=b;row++){let food=cell(diet,XLSX.utils.encode_cell({r:row-1,c:COLS[i]-1})),qty=cell(diet,XLSX.utils.encode_cell({r:row-1,c:COLS[i]})),unit=cell(diet,XLSX.utils.encode_cell({r:row-1,c:COLS[i]+1}));if(food!==null&&food!==''&&qty!==null&&qty!==''){if(!unit||String(unit).startsWith('='))unit=units[String(food).trim().toLowerCase()]||'';items.push({name:String(food),qty:Number(qty),unit:String(unit||'')})}}meals[t]=items}return{name,date:addDays(start,i),meals}});return{updatedAt:new Date().toISOString(),days}}async function importFile(f){try{$('status').textContent='Leyendo el Excel en este dispositivo…';let d=parseWorkbook(await f.arrayBuffer());S.data=d;S.i=todayIdx();S.shopping=[];localStorage.setItem(DATA_KEY,JSON.stringify(d));setView(S.view);render();$('status').textContent='Dieta importada de forma privada en este dispositivo.';setTimeout(()=>$('status').classList.add('hidden'),2500)}catch(e){$('status').textContent=`No se pudo leer el Excel: ${e.message}`}}
async function copyShopping(){let text=selectedText();if(!text){toast('Marca al menos un producto');return false}try{await navigator.clipboard.writeText(text)}catch{let a=document.createElement('textarea');a.value=text;a.style.position='fixed';a.style.opacity='0';document.body.append(a);a.select();document.execCommand('copy');a.remove()}toast('Compra copiada · pégala en AnyList');return true}
$('form').onsubmit=e=>{if(e.submitter?.value==='default'){let a=S.active,r=reg();r[a.fp]={title:$('titlein').value.trim()||a.title,time:Number($('timein').value)||null,prep:$('prepin').checked,note:$('notein').value.trim()};saveReg(r);render()}};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{S.p=Number(b.dataset.p);S.shopping=[];document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('on',Number(x.dataset.p)===S.p));if(S.data)render()});$('prev').onclick=()=>{S.i=(S.i+6)%7;renderDay()};$('next').onclick=()=>{S.i=(S.i+1)%7;renderDay()};$('extrasBtn').onclick=()=>{S.extras=!S.extras;renderDay()};$('prepareBuy').onclick=()=>{loadShopping();setView('shopping')};$('resetBuy').onclick=()=>{makeShopping();renderShopping();toast('Compra regenerada desde el Excel')};$('addBuy').onclick=()=>{let name=$('addName').value.trim(),m=$('addQty').value.trim().match(/^([\d.,]+)?\s*(.*)$/);if(!name)return;let quantity=m?.[1]?Number(m[1].replace(',','.')):0,[unit,factor]=unitInfo(m?.[2]||'');S.shopping.push({id:`manual-${Date.now()}`,name:cap(name),quantity:Number.isFinite(quantity)?quantity*factor:0,unit,category:category(name),selected:true});$('addName').value='';$('addQty').value='';saveBuy();renderShopping()};$('addName').onkeydown=e=>{if(e.key==='Enter')$('addBuy').click()};$('copyBuy').onclick=copyShopping;$('shortcutBuy').onclick=async()=>{if(S.buyStatus==='sent'){toast('Ya enviada · regenera para volver a enviar');return}let text=selectedText();if(!text){toast('Marca al menos un producto');return}if(!/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent)){await copyShopping();return}S.buyStatus='sent';saveBuy();renderShopping();location.href=`shortcuts://run-shortcut?name=${encodeURIComponent('Enviar a AnyList')}&input=text&text=${encodeURIComponent(text)}`};$('file').onchange=e=>{let f=e.target.files?.[0];if(f)importFile(f);e.target.value=''};try{let c=localStorage.getItem(DATA_KEY);if(c){S.data=JSON.parse(c);S.i=todayIdx();setView('today');render();$('status').textContent='Dieta privada cargada desde este dispositivo.';setTimeout(()=>$('status').classList.add('hidden'),1800)}}catch{localStorage.removeItem(DATA_KEY)}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
